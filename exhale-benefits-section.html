<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exhale · Built for the family CEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<!--
  ══════════════════════════════════════════════════════════════════
  EXHALE · "Built for the family CEO" section
  Drop-in website section. Self contained: no build step, no deps.

  Headline sits on a left rail. Five moments stand as columns that
  rest dimmed and equal, then expand and light up on hover, focus or
  tap, revealing their caption. Only one is ever open.

  PHOTOS
    Served from Cloudinary at 1856x2304 (4:5), delivered through
    f_auto,q_auto,w_1600 so each column ships ~150-350KB of WebP or
    AVIF instead of a ~3MB JPEG. Drop that transform segment from a
    URL to get the untouched original back.

    To swap a photo, change its data-src. Clear it, or let a URL
    404, and the column falls back to the tinted gradient set by
    --tone-near / --tone-far on its <li>, so the rack never renders
    an empty box. Photos are graded into the brand automatically
    (desaturate, cyan lift, vignette) and dimmed harder while the
    column is at rest.

    Crop note: the visible width swings from 583px open to 134px at
    rest, so only the middle ~26% of a frame survives the collapsed
    state. Keep the subject centred, and keep detail out of the
    bottom-left where the name and line sit.

  TO EMBED IN THE SITE
    Copy the <section class="benefits"> block, the CSS between the
    BENEFITS CSS markers, and the <script> at the bottom. The
    :root tokens already match exhale_how_it_works.html.
  ══════════════════════════════════════════════════════════════════
-->

<style>
  /* ── page chrome, only here so the file opens standalone ── */
  :root {
    --bg: #0a0a0a;
    --bg-surface: #111118;
    --bg-card: #16161e;
    --cyan: #ADFBF6;
    --cyan-deep: #5CECD3;
    --ink: #E8F0EE;
    --ink-soft: #9BA8A5;
    --ink-muted: #5A6664;
    --border: #1E1E28;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ══════════════ BENEFITS CSS ══════════════ */

  .benefits {
    position: relative;
    padding: clamp(64px, 8vw, 128px) clamp(20px, 4vw, 56px);
    overflow: hidden;
    isolation: isolate;
  }
  /* ambient glow behind the rack */
  .benefits::before {
    content: "";
    position: absolute;
    right: -6%;
    top: 50%;
    width: min(1200px, 90vw);
    height: 620px;
    transform: translateY(-50%);
    background: radial-gradient(ellipse at center, rgba(173,251,246,0.06) 0%, rgba(10,10,10,0) 70%);
    pointer-events: none;
    z-index: -1;
  }

  .benefits__inner {
    max-width: 1520px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(240px, 330px) 1fr;
    gap: clamp(28px, 4.5vw, 80px);
    align-items: center;
  }

  /* ── left rail ── */
  .benefits__head { text-align: left; }

  .benefits__title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-size: clamp(34px, 3.5vw, 56px);
    line-height: 1.14;
    letter-spacing: 0.01em;
    color: #f5f5f5;
  }
  .benefits__title em {
    position: relative;
    display: inline-block;
    font-style: normal;
    color: var(--cyan);
    letter-spacing: 0.06em;
    padding-left: 0.06em;
    text-shadow: 0 0 12px rgba(173,251,246,0.55), 0 0 44px rgba(173,251,246,0.3);
  }
  .benefits__title em::after {
    content: "";
    position: absolute;
    left: 0.06em; right: 0; bottom: -0.14em;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan) 20%, var(--cyan-deep) 80%, transparent);
    box-shadow: 0 0 12px rgba(173,251,246,0.7), 0 0 34px rgba(173,251,246,0.4);
  }

  /* ── the rack ── */
  .rack {
    display: flex;
    gap: 6px;
    height: clamp(430px, 58vh, 640px);
    list-style: none;
  }

  .col {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    transition: flex-grow 760ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  /* every column gives way once the rack has a focus of attention */
  .rack:hover .col,
  .rack:focus-within .col { flex-grow: 0.78; }
  /* ...and the one being attended to takes the room. Listed after the
     rule above so it wins the tie on equal specificity. */
  .rack .col:hover,
  .rack .col:focus-within,
  .rack .col.is-open { flex-grow: 3.2; }

  .col__frame {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 6px;
    overflow: hidden;
    background: linear-gradient(150deg, var(--tone-near) 0%, var(--tone-far) 72%);
    /* overlay type is sized against the column, not the viewport, so it
       scales as the column opens and holds at every breakpoint */
    container-type: size;
  }

  /* media layer: filtered on its own so the type above stays crisp */
  .col__media {
    position: absolute;
    inset: 0;
    filter: grayscale(0.95) brightness(0.38) contrast(1.02);
    transform: scale(1.02);
    transition: filter 760ms cubic-bezier(0.16, 1, 0.3, 1),
                transform 1400ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .col:hover .col__media,
  .col:focus-within .col__media,
  .col.is-open .col__media {
    filter: grayscale(0.34) brightness(0.94) contrast(1.06);
    transform: scale(1.06);
  }

  .col__photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* cyan grade, grain and the scrim the caption sits on */
  .col__grade {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(10,10,15,0) 40%, rgba(10,10,15,0.52) 74%, rgba(8,8,12,0.9) 100%),
      linear-gradient(180deg, rgba(92,236,211,0.1) 0%, rgba(10,10,15,0.3) 100%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 1px, rgba(0,0,0,0) 1px 4px);
  }

  /* vignette and hairline edge, brighter on the open column */
  .col__edge {
    position: absolute;
    inset: 0;
    z-index: 2;
    border-radius: 6px;
    pointer-events: none;
    box-shadow:
      inset 0 0 90px rgba(0,0,0,0.6),
      inset 0 0 0 1px rgba(173,251,246,0.06);
    transition: box-shadow 760ms ease;
  }
  .col:hover .col__edge,
  .col:focus-within .col__edge,
  .col.is-open .col__edge {
    box-shadow:
      inset 0 0 90px rgba(0,0,0,0.45),
      inset 0 0 0 1px rgba(173,251,246,0.3);
  }

  /* ── caption: the name is always there, the line unfolds on open ── */
  .col__caption {
    position: absolute;
    z-index: 4;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0 max(16px, 6.5cqw) max(20px, 6cqh);
    text-align: left;
    pointer-events: none;
  }

  /* the column name, doubling as the resting label */
  .col__kicker {
    font-family: 'DM Sans', sans-serif;
    font-size: max(10px, 1.5cqw);
    font-weight: 500;
    letter-spacing: 0.16em;
    line-height: 1.5;
    text-transform: uppercase;
    color: rgba(232,240,238,0.62);
    text-shadow: 0 1px 12px rgba(0,0,0,0.9);
    transition: color 560ms ease, letter-spacing 620ms cubic-bezier(0.16, 1, 0.3, 1),
                text-shadow 560ms ease;
  }
  .col:hover .col__kicker,
  .col:focus-within .col__kicker,
  .col.is-open .col__kicker {
    color: var(--cyan);
    letter-spacing: 0.28em;
    text-shadow: 0 0 14px rgba(173,251,246,0.5), 0 1px 12px rgba(0,0,0,0.9);
  }

  /* 0fr to 1fr is the animatable way to open to the line's own height,
     so the name stays put instead of being shoved up by hidden text */
  .col__reveal {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 660ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .col__revealInner { overflow: hidden; min-height: 0; }
  .col:hover .col__reveal,
  .col:focus-within .col__reveal,
  .col.is-open .col__reveal { grid-template-rows: 1fr; }

  .col__line {
    padding-top: 2.6cqh;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: max(21px, 5.1cqw);
    line-height: 1.24;
    color: #f2f2f2;
    max-width: 88%;
    text-shadow: 0 2px 24px rgba(0,0,0,0.85), 0 1px 3px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 440ms ease, transform 560ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .col:hover .col__line,
  .col:focus-within .col__line,
  .col.is-open .col__line {
    opacity: 1;
    transform: none;
    transition-delay: 220ms;          /* lets the column widen before the type lands */
  }

  /* ── the hit area: carries focus, click and the accessible name ── */
  .col__hit {
    position: absolute;
    inset: 0;
    z-index: 5;
    width: 100%;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    border-radius: 6px;
  }
  .col__hit:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  /* ── responsive: the rack turns on its side into a stack ──
     flex-grow drives height instead of width, so the same open and
     rest logic carries over without a second interaction model. */
  @media (max-width: 900px) {
    .benefits__inner {
      grid-template-columns: 1fr;
      gap: clamp(32px, 6vw, 52px);
    }
    .benefits__head { max-width: 620px; }

    .rack {
      flex-direction: column;
      height: clamp(520px, 82vh, 700px);
      gap: 8px;
    }
    .col__caption { padding: 0 max(18px, 5cqw) max(18px, 5cqh); }
    .col__kicker { font-size: 10.5px; }
    .col__line { font-size: max(20px, 4.4cqw); max-width: 100%; padding-top: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .col,
    .col__media,
    .col__edge,
    .col__kicker,
    .col__reveal,
    .col__line { transition-duration: 1ms; }
    .col:hover .col__line,
    .col:focus-within .col__line,
    .col.is-open .col__line { transition-delay: 0ms; }
    .col__media,
    .col:hover .col__media,
    .col:focus-within .col__media,
    .col.is-open .col__media { transform: none; }
  }
  /* ══════════════ /BENEFITS CSS ══════════════ */
</style>
</head>
<body>

<section class="benefits" id="benefits" aria-labelledby="benefits-title">
  <div class="benefits__inner">

    <!-- ── left rail ── -->
    <header class="benefits__head">
      <h2 class="benefits__title" id="benefits-title">
        Built for the <em>family CEO</em>.
      </h2>
    </header>

    <!-- ── the rack ── -->
    <ul class="rack" id="benefitsRack">

      <!-- 1 · Mornings -->
      <li class="col" style="--tone-near:#2b2115; --tone-far:#0b0b0f;">
        <figure class="col__frame">
          <div class="col__media">
            <img class="col__photo" data-src="https://res.cloudinary.com/diuqpckme/image/upload/f_auto,q_auto,w_1600/v1787684375/Mornings_n1f5t7.jpg" alt="A Black woman packing a school lunch in her kitchen in early morning light.">
          </div>
          <div class="col__grade"></div>
          <div class="col__edge"></div>
          <figcaption class="col__caption">
            <p class="col__kicker">Mornings</p>
            <div class="col__reveal"><div class="col__revealInner">
              <p class="col__line">The permission slip is signed before you remember it exists.</p>
            </div></div>
          </figcaption>
        </figure>
        <button class="col__hit" type="button" aria-expanded="false">
          <span class="visually-hidden">Mornings. The permission slip is signed before you remember it exists.</span>
        </button>
      </li>

      <!-- 2 · The 2pm meeting -->
      <li class="col" style="--tone-near:#13232b; --tone-far:#0b0b0f;">
        <figure class="col__frame">
          <div class="col__media">
            <img class="col__photo" data-src="https://res.cloudinary.com/diuqpckme/image/upload/f_auto,q_auto,w_1600/v1787684375/The_2pm_meeting_vkwcfj.jpg" alt="An Asian woman leading a meeting in a glass-walled conference room.">
          </div>
          <div class="col__grade"></div>
          <div class="col__edge"></div>
          <figcaption class="col__caption">
            <p class="col__kicker">The 2pm meeting</p>
            <div class="col__reveal"><div class="col__revealInner">
              <p class="col__line">You are fully in the room, because home is already handled.</p>
            </div></div>
          </figcaption>
        </figure>
        <button class="col__hit" type="button" aria-expanded="false">
          <span class="visually-hidden">The 2pm meeting. You are fully in the room, because home is already handled.</span>
        </button>
      </li>

      <!-- 3 · The handoff -->
      <li class="col" style="--tone-near:#1f1a2b; --tone-far:#0b0b0f;">
        <figure class="col__frame">
          <div class="col__media">
            <img class="col__photo" data-src="https://res.cloudinary.com/diuqpckme/image/upload/f_auto,q_auto,w_1600/v1787684375/the_handoff_wexac3.jpg" alt="A Latina woman walking away from her home on a business call, her partner holding their child in the doorway behind her.">
          </div>
          <div class="col__grade"></div>
          <div class="col__edge"></div>
          <figcaption class="col__caption">
            <p class="col__kicker">The handoff</p>
            <div class="col__reveal"><div class="col__revealInner">
              <p class="col__line">Your partner stops asking who has it. It is already done.</p>
            </div></div>
          </figcaption>
        </figure>
        <button class="col__hit" type="button" aria-expanded="false">
          <span class="visually-hidden">The handoff. Your partner stops asking who has it. It is already done.</span>
        </button>
      </li>

      <!-- 4 · Dinner -->
      <li class="col" style="--tone-near:#2b1a18; --tone-far:#0b0b0f;">
        <figure class="col__frame">
          <div class="col__media">
            <img class="col__photo" data-src="https://res.cloudinary.com/diuqpckme/image/upload/f_auto,q_auto,w_1600/v1787684375/dinner_yuogg4.jpg" alt="A Black family at the dinner table, the mother's phone face down beside her plate.">
          </div>
          <div class="col__grade"></div>
          <div class="col__edge"></div>
          <figcaption class="col__caption">
            <p class="col__kicker">Dinner</p>
            <div class="col__reveal"><div class="col__revealInner">
              <p class="col__line">Nobody at this table is checking a calendar.</p>
            </div></div>
          </figcaption>
        </figure>
        <button class="col__hit" type="button" aria-expanded="false">
          <span class="visually-hidden">Dinner. Nobody at this table is checking a calendar.</span>
        </button>
      </li>

      <!-- 5 · Sunday night -->
      <li class="col" style="--tone-near:#141f26; --tone-far:#0b0b0f;">
        <figure class="col__frame">
          <div class="col__media">
            <img class="col__photo" data-src="https://res.cloudinary.com/diuqpckme/image/upload/f_auto,q_auto,w_1600/v1787684375/sunday_night_t85egu.jpg" alt="A white woman reading on her couch by lamp light.">
          </div>
          <div class="col__grade"></div>
          <div class="col__edge"></div>
          <figcaption class="col__caption">
            <p class="col__kicker">Sunday night</p>
            <div class="col__reveal"><div class="col__revealInner">
              <p class="col__line">The week ahead does not need to be reassembled.</p>
            </div></div>
          </figcaption>
        </figure>
        <button class="col__hit" type="button" aria-expanded="false">
          <span class="visually-hidden">Sunday night. The week ahead does not need to be reassembled.</span>
        </button>
      </li>

    </ul>
  </div>
</section>

<script>
(function () {
  "use strict";

  var rack = document.getElementById("benefitsRack");
  if (!rack) return;

  var cols = Array.prototype.slice.call(rack.querySelectorAll(".col"));
  var hits = cols.map(function (col) { return col.querySelector(".col__hit"); });

  // ── photos: only request a file when one has actually been set ──
  cols.forEach(function (col) {
    var img = col.querySelector(".col__photo");
    var src = img && img.getAttribute("data-src");
    if (!img) return;
    if (src) {
      // if the file is missing, fall back to the designed plate
      img.addEventListener("error", function () { img.remove(); });
      img.src = src;
    } else {
      img.remove();
    }
  });

  // ── open state. Hover handles this on its own in CSS; this is for
  //    tap and for keyboard, and it is what keeps a column pinned. ──
  function open(index) {
    cols.forEach(function (col, i) {
      var on = i === index;
      col.classList.toggle("is-open", on);
      hits[i].setAttribute("aria-expanded", String(on));
    });
  }

  hits.forEach(function (hit, i) {
    hit.addEventListener("click", function () {
      open(cols[i].classList.contains("is-open") ? -1 : i);
    });

    hit.addEventListener("keydown", function (e) {
      var step = 0;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") step = 1;
      else if (e.key === "ArrowLeft" || e.key === "ArrowUp") step = -1;
      else if (e.key === "Home") { e.preventDefault(); hits[0].focus(); return; }
      else if (e.key === "End") { e.preventDefault(); hits[hits.length - 1].focus(); return; }
      if (!step) return;
      e.preventDefault();
      hits[(i + step + hits.length) % hits.length].focus();
    });
  });

  // ── touch has no hover, so start with the first column open ──
  if (!window.matchMedia("(hover: hover)").matches) open(0);
})();
</script>

</body>
</html>
